name: Finance NLP Pipeline

on:
  workflow_dispatch:
    inputs:
      news_source:
        description: "RSS feed to fetch from"
        required: true
        default: "yahoo_finance"
        type: choice
        options:
          - yahoo_finance
          - reuters_business
          - cnbc_top
          - marketwatch
          - seeking_alpha
      article_limit:
        description: "Number of articles to analyse (1-30)"
        required: true
        default: "10"
        type: string

jobs:
  run-finance-nlp:
    name: Run Finance NLP Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start ingestion node (port 8001)
        working-directory: services/ingestion
        run: uvicorn main:app --host 0.0.0.0 --port 8001 --log-level warning &

      - name: Start NLP processor node (port 8002)
        working-directory: services/nlp_processor
        run: uvicorn main:app --host 0.0.0.0 --port 8002 --log-level warning &

      - name: Start storage node (port 8003)
        working-directory: services/storage
        run: uvicorn main:app --host 0.0.0.0 --port 8003 --log-level warning &

      - name: Start dashboard node (port 8000)
        working-directory: services/dashboard
        env:
          INGESTION_HOST: localhost
          INGESTION_PORT: "8001"
          NLP_HOST: localhost
          NLP_PORT: "8002"
          STORAGE_HOST: localhost
          STORAGE_PORT: "8003"
        run: uvicorn main:app --host 0.0.0.0 --port 8000 --log-level warning &

      - name: Wait for all nodes to be ready
        run: |
          for port in 8001 8002 8003 8000; do
            echo "Waiting for port $port..."
            for i in $(seq 1 30); do
              curl -sf "http://localhost:$port/" > /dev/null && echo "  :$port online" && break
              sleep 1
            done
          done

      - name: Run Finance NLP pipeline
        run: |
          curl -sf \
            "http://localhost:8000/api/run?source=${{ github.event.inputs.news_source }}&limit=${{ github.event.inputs.article_limit }}" \
            -o pipeline_result.json
          python scripts/print_results.py

      - name: Generate HTML report
        run: python scripts/generate_report.py

      - name: Write job summary
        run: python scripts/write_summary.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: finance-nlp-results-${{ github.run_number }}
          path: |
            pipeline_result.json
            finance_nlp_report.html
          retention-days: 30
